server {
    listen       8080;
    server_name  localhost;
    root   /usr/share/nginx/html;
    # Relative Location headers: Traefik in front decides host and scheme (https).
    absolute_redirect off;
    # The app loads its files relative to the URL, so the path needs the trailing slash.
    location = /umwelt-monitoring {
        return 301 /umwelt-monitoring/;
    }
    # Services without CORS headers, same paths as SERVICE_PROXIES in vite.config.ts.
    # Fixed targets only, never take the target from the request (open proxy).
    # Exact endpoints only (those in dataLayers.json), not the whole remote host.
    location = /umwelt-monitoring/proxy/leverkusen/GCGisService {
        proxy_pass https://geoportal.leverkusen.de/GCGisService;
        proxy_ssl_server_name on;
    }
    location /umwelt-monitoring/proxy/ {
        return 404;
    }
    location /umwelt-monitoring/ {
        index  index.html index.htm;
        try_files $uri $uri.html $uri/ /umwelt-monitoring/index.html;
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
